name: check

on:
  push:
  pull_request:

# The suite reads committed files and nothing else, and enforces that on itself: the
# socket is taken away for the whole test session, so a test that reaches for the network
# fails saying so. No secrets are needed, and none are granted. Capturing a new
# observation is a local command a person runs and reviews, never something CI does.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `just` comes from PyPI so the only tooling CI needs is uv.
      - run: uvx --from rust-just@1.58.0 just check
